const WHATSAPP_NUMBER = "6285284847171"; // format 62xxxxxxxxxx, tanpa + atau 0 di depan
const NAMA_TOKO = "AAN DONUT";
const TAGLINE = "Rasa Sepenuh Hati";
const MIN_QTY = 6; // jumlah pcs minimal per pesanan (1 dus)
const QTY_STEP = 3; // kelipatan naik/turunnya jumlah pesanan

/* =========================================================
   UTILITAS
   ========================================================= */
function formatRupiah(angka) {
  return new Intl.NumberFormat("id-ID", {
    style: "currency",
    currency: "IDR",
    minimumFractionDigits: 0,
  }).format(angka || 0);
}

function generateId() {
  return Math.random().toString(36).slice(2, 10);
}

// Ubah nomor HP pelanggan (0852..., 62852..., +62852...) jadi link WhatsApp.
function toWaLink(phone, text) {
  const digits = (phone || "").replace(/\D/g, "");
  if (digits.length < 8) return null;
  let normalized = digits;
  if (normalized.startsWith("0")) normalized = "62" + normalized.slice(1);
  else if (!normalized.startsWith("62")) normalized = "62" + normalized;
  return `https://wa.me/${normalized}${text ? `?text=${encodeURIComponent(text)}` : ""}`;
}

function formatWaktu(timestamp) {
  if (!timestamp || !timestamp.toDate) return "Baru saja";
  return timestamp.toDate().toLocaleString("id-ID", {
    day: "numeric", month: "short", hour: "2-digit", minute: "2-digit",
  });
}

/* =========================================================
   KOMPONEN UMUM
   ========================================================= */
function Spinner() {
  return (
    <div className="flex justify-center py-10">
      <div className="w-8 h-8 border-4 border-kraft border-t-gold rounded-full animate-spin"></div>
    </div>
  );
}

function EmptyState({ text }) {
  return <p className="text-center text-chocosoft/60 text-sm py-6">{text}</p>;
}

function Toast({ toast, onClose }) {
  if (!toast.message) return null;
  const isError = toast.type === "error";
  return (
    <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full shadow-lg text-sm font-medium flex items-center gap-3 max-w-[90vw] ${isError ? "bg-choco text-cream" : "bg-gold text-white"}`}>
      <span>{toast.message}</span>
      <button onClick={onClose} className="opacity-60 hover:opacity-100 shrink-0">✕</button>
    </div>
  );
}

// Pilihan bergaya "chip" — dipakai untuk Varian, Glaze, Topping, Filling.
function OptionChips({ label, options, value, onChange, allowNone, noneLabel, emptyText }) {
  return (
    <div>
      <label className="text-sm text-chocosoft">{label}</label>
      <div className="flex flex-wrap gap-2 mt-1.5">
        {allowNone && (
          <button
            type="button"
            onClick={() => onChange("")}
            className={`px-3.5 py-2 rounded-full text-sm border transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold ${
              value === "" ? "bg-choco text-cream border-choco" : "bg-white text-chocosoft border-kraft hover:border-choco/40"
            }`}
          >
            {noneLabel}
          </button>
        )}
        {options.map((o) => {
          const disabled = o.available === false;
          const selected = value === o.id;
          return (
            <button
              type="button"
              key={o.id}
              disabled={disabled}
              onClick={() => onChange(o.id)}
              className={`px-3.5 py-2 rounded-full text-sm border transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold ${
                disabled
                  ? "bg-kraft/20 text-chocosoft/40 border-kraft/60 line-through cursor-not-allowed"
                  : selected
                  ? "bg-gold text-white border-gold shadow-sm shadow-gold/40"
                  : "bg-white text-chocosoft border-kraft hover:border-gold/60"
              }`}
            >
              {o.name}{disabled ? " · Habis" : ""}
            </button>
          );
        })}
      </div>
      {options.length === 0 && emptyText && <p className="text-xs text-rust mt-1">{emptyText}</p>}
    </div>
  );
}

/* =========================================================
   HEADER
   ========================================================= */
function Header({ view, setView }) {

          >

          </button>
          <button
            onClick={() => setView("admin")}

}

function BrandStrip() {
  return (
    <div className="flex items-center gap-3.5 bg-gradient-to-r from-gold/15 via-gold/5 to-transparent border border-gold/25 rounded-2xl px-4 py-3.5">
      <img
        src={LOGO_SRC}
        alt={NAMA_TOKO}
        className="w-14 h-14 rounded-full shrink-0 object-cover"
        onError={(e) => { e.target.style.display = "none"; }}

      <div>
        <p className="font-display text-lg leading-none text-choco">{NAMA_TOKO}</p>
        <p className="text-sm text-rust italic mt-1.5">{TAGLINE}</p>
      </div>
    </div>

}

/* =========================================================
   HALAMAN PEMESANAN
   ========================================================= */
function OrderPage({ notify }) {
  const [category, setCategory] = useState("donat"); // "donat" | "bomboloni"
  const [variants, setVariants] = useState([]);
  const [glazes, setGlazes] = useState([]);
  const [toppings, setToppings] = useState([]);
  const [fillings, setFillings] = useState([]);
  const [harga, setHarga] = useState({ donatDusIsi6: 0, bombolomiDusIsi6: 0 });
  const [info, setInfo] = useState({ text: "", donatAvailable: true, bombolomiAvailable: true });
  const [loadingVariants, setLoadingVariants] = useState(true);

  const [targetQty, setTargetQty] = useState(MIN_QTY);
  const [selVariant, setSelVariant] = useState("");
  const [selGlaze, setSelGlaze] = useState("");
  const [selTopping, setSelTopping] = useState("");
  const [selFilling, setSelFilling] = useState("");
  const [qty, setQty] = useState(1);

  const [cart, setCart] = useState([]);
  const [customerName, setCustomerName] = useState("");
  const [customerPhone, setCustomerPhone] = useState("");
  const [note, setNote] = useState("");
  const [submitting, setSubmitting] = useState(false);

  const variantCollection = category === "donat" ? "variants" : "variantsBomboloni";
  const categoryAvailable = category === "donat" ? (info.donatAvailable !== false) : (info.bombolomiAvailable !== false);

  useEffect(() => {
    setLoadingVariants(true);
    setCart([]);
    setTargetQty(MIN_QTY);
    setSelVariant(""); setSelGlaze(""); setSelTopping(""); setSelFilling("");
    const unsub = db.collection(variantCollection).orderBy("name").onSnapshot(
      (snap) => { setVariants(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoadingVariants(false); },
      (err) => { console.error("variants:", err); setLoadingVariants(false); }
    );
    return unsub;
  }, [category]);

  useEffect(() => {
    const unsub2 = db.collection("glazes").orderBy("name").onSnapshot(
      (snap) => setGlazes(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), (err) => console.error("glazes:", err)
    );
    const unsub3 = db.collection("toppings").orderBy("name").onSnapshot(
      (snap) => setToppings(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), (err) => console.error("toppings:", err)
    );
    const unsub4 = db.collection("fillings").orderBy("name").onSnapshot(
      (snap) => setFillings(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), (err) => console.error("fillings:", err)
    );
    const unsub5 = db.collection("settings").doc("harga").onSnapshot(
      (doc) => setHarga(doc.exists ? doc.data() : { donatDusIsi6: 0, bombolomiDusIsi6: 0 }), (err) => console.error("harga:", err)
    );
    const unsub6 = db.collection("settings").doc("info").onSnapshot(
      (doc) => setInfo(doc.exists ? { text: "", donatAvailable: true, bombolomiAvailable: true, ...doc.data() } : { text: "", donatAvailable: true, bombolomiAvailable: true }),
      (err) => console.error("info:", err)
    );
    return () => { unsub2(); unsub3(); unsub4(); unsub5(); unsub6(); };
  }, []);

  const hargaDusIsi6 = category === "donat" ? (harga.donatDusIsi6 || 0) : (harga.bombolomiDusIsi6 || 0);
  const hargaPerPcs = hargaDusIsi6 / 6;

  const cartTotalQty = useMemo(() => cart.reduce((sum, c) => sum + c.qty, 0), [cart]);
  const remaining = targetQty - cartTotalQty;
  const isComplete = remaining === 0;
  const total = Math.round(hargaPerPcs * targetQty);

  function handleCategoryChange(next, available) {
    if (available === false || category === next) return;
    if (cart.length > 0 && !window.confirm("Ganti kategori akan mengosongkan keranjang yang sedang diisi. Lanjutkan?")) return;
    setCategory(next);
  }

  function changeTargetQty(delta) {
    setTargetQty((q) => {
      const next = q + delta;
      if (next < MIN_QTY) return q;
      if (next < cartTotalQty) return q; // tidak boleh lebih kecil dari isi keranjang saat ini
      return next;
    });
  }

  function addToCart() {
    if (!selVariant) return notify("Pilih varian dulu", "error");
    if (category === "bomboloni" && !selFilling) return notify("Pilih filling dulu", "error");
    if (remaining <= 0) return notify(`1 dus sudah penuh (${targetQty} pcs). Tambah jumlah dus dulu kalau mau lebih.`, "error");
    const variant = variants.find((v) => v.id === selVariant);
    const addQty = Math.min(qty, remaining);
    let details;
    if (category === "donat") {
      const glaze = glazes.find((g) => g.id === selGlaze);
      const topping = toppings.find((t) => t.id === selTopping);
      details = [glaze?.name || "Tanpa glaze", topping?.name || "Tanpa topping"];
    } else {
      const filling = fillings.find((f) => f.id === selFilling);
      details = [filling?.name || ""];
    }
    setCart((prev) => [
      ...prev,
      { id: generateId(), variantName: variant?.name || "", details, qty: addQty },
    ]);
    setSelVariant(""); setSelGlaze(""); setSelTopping(""); setSelFilling(""); setQty(1);
  }

  function removeFromCart(id) {
    setCart((prev) => prev.filter((c) => c.id !== id));
  }

  async function submitOrder() {
    if (!isComplete) return notify(`Lengkapi ${remaining} pcs lagi dulu`, "error");
    if (!customerName.trim()) return notify("Nama pemesan harus diisi", "error");

    const labelKategori = category === "donat" ? "Donat" : "Bomboloni";
    let msg = `Halo ${NAMA_TOKO}, saya ingin pesan ${labelKategori} (1 dus isi ${targetQty}):\n\n`;
    cart.forEach((c, i) => {
      msg += `${i + 1}. ${c.variantName} - ${c.details.join(", ")} (x${c.qty})\n`;
    });
    msg += `\nTotal: ${formatRupiah(total)}\n\nAtas nama: ${customerName.trim()}`;
    if (customerPhone.trim()) msg += `\nNo. HP: ${customerPhone.trim()}`;
    if (note.trim()) msg += `\nCatatan: ${note.trim()}`;

    // Buka WhatsApp SEBELUM proses async (await) apa pun, supaya browser (terutama
    // Safari/iPhone) tidak menganggap ini popup dan memblokirnya.
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");

    setSubmitting(true);
    try {
      await db.collection("orders").add({
        category,
        customerName: customerName.trim(),
        customerPhone: customerPhone.trim(),
        note: note.trim(),
        boxQty: targetQty,
        items: cart,
        total,
        status: "baru",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setCart([]); setTargetQty(MIN_QTY); setCustomerName(""); setCustomerPhone(""); setNote("");
      notify("Pesanan tersimpan, lanjutkan di WhatsApp yang baru terbuka", "success");
    } catch (err) {
      console.error(err);
      notify("Chat WhatsApp sudah terbuka, tapi pesanan gagal tersimpan di sistem kami: " + err.message, "error");
    } finally {
      setSubmitting(false);
    }
  }

  return (
    <div className="max-w-md mx-auto px-5 py-6 space-y-5">
      <BrandStrip />

      {info.text && (
        <div className="bg-gold/10 border border-gold/30 rounded-2xl p-4 text-sm whitespace-pre-line">
          {info.text}
        </div>
      )}

      <div className="flex justify-center">
        <div className="flex gap-1 bg-choco/10 rounded-full p-1">
          <button
            onClick={() => handleCategoryChange("donat", info.donatAvailable !== false)}
            disabled={info.donatAvailable === false}
            className={`px-5 py-2 rounded-full text-sm font-medium transition disabled:opacity-40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold ${category === "donat" ? "bg-choco text-cream" : "text-chocosoft"}`}
          >
            Donat{info.donatAvailable === false ? " (Tutup)" : ""}
          </button>
          <button
            onClick={() => handleCategoryChange("bomboloni", info.bombolomiAvailable !== false)}
            disabled={info.bombolomiAvailable === false}
            className={`px-5 py-2 rounded-full text-sm font-medium transition disabled:opacity-40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold ${category === "bomboloni" ? "bg-choco text-cream" : "text-chocosoft"}`}
          >
            Bomboloni{info.bombolomiAvailable === false ? " (Tutup)" : ""}
          </button>
        </div>
      </div>

      {loadingVariants ? (
        <Spinner />
      ) : !categoryAvailable ? (
        <EmptyState text={`${category === "donat" ? "Donat" : "Bomboloni"} sedang tidak menerima pesanan.`} />
      ) : hargaDusIsi6 <= 0 ? (
        <EmptyState text={`Harga 1 dus ${category === "donat" ? "Donat" : "Bomboloni"} belum diatur admin.`} />
      ) : (
        <>
          <div className="bg-paper border border-kraft rounded-2xl p-5 text-center">
            <p className="text-sm text-chocosoft">Jumlah dalam 1 pesanan</p>
            <p className="text-xs text-chocosoft/60 mt-0.5">Minimal {MIN_QTY} pcs, kelipatan {QTY_STEP} — {formatRupiah(hargaDusIsi6)}/dus isi 6</p>
            <div className="flex items-center justify-center gap-5 pt-3">
              <button
                onClick={() => changeTargetQty(-QTY_STEP)}
                disabled={targetQty <= MIN_QTY || targetQty - QTY_STEP < cartTotalQty}
                className="w-9 h-9 rounded-full bg-kraft/50 text-choco font-bold text-lg disabled:opacity-30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold"
              >
                −
              </button>
              <span className="font-display text-2xl w-20">{targetQty} pcs</span>
              <button
                onClick={() => changeTargetQty(QTY_STEP)}
                className="w-9 h-9 rounded-full bg-kraft/50 text-choco font-bold text-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold"
              >
                +
              </button>
            </div>
          </div>

          <div className="bg-paper border border-kraft rounded-2xl p-5 space-y-4">
            <div className="flex items-center justify-between">
              <h2 className="font-display text-xl">Pilih {category === "donat" ? "Donat" : "Bomboloni"}</h2>
              <span className="text-xs text-chocosoft bg-kraft/40 rounded-full px-2.5 py-1 shrink-0">{cartTotalQty}/{targetQty} pcs</span>
            </div>

            <OptionChips
              label="Varian"
              options={variants}
              value={selVariant}
              onChange={setSelVariant}
              emptyText="Varian belum diisi admin."
            />

            {category === "donat" ? (
              <>
                <OptionChips label="Glaze" options={glazes} value={selGlaze} onChange={setSelGlaze} allowNone noneLabel="Tanpa glaze" />
                <OptionChips label="Topping" options={toppings} value={selTopping} onChange={setSelTopping} allowNone noneLabel="Tanpa topping" />
              </>
            ) : (
              <OptionChips
                label="Filling"
                options={fillings}
                value={selFilling}
                onChange={setSelFilling}
                emptyText="Filling belum diisi admin."
              />
            )}

            <div>
              <label className="text-sm text-chocosoft">Jumlah untuk kombinasi ini</label>
              <input
                type="number" min="1" max={Math.max(remaining, 1)} value={qty}
                onChange={(e) => setQty(Math.max(1, Math.min(remaining || 1, parseInt(e.target.value) || 1)))}
                className="w-full border border-kraft rounded-xl p-2.5 mt-1 bg-white outline-none focus-visible:ring-2 focus-visible:ring-gold"
              />
            </div>

            <button
              onClick={addToCart}
              disabled={remaining <= 0}
              className="w-full bg-gradient-to-r from-gold to-rust hover:brightness-105 text-white rounded-full py-3 font-semibold transition disabled:opacity-40 disabled:grayscale focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold focus-visible:ring-offset-2"
            >
              {remaining <= 0 ? "1 dus sudah penuh" : "Tambah ke Keranjang"}
            </button>
          </div>

          {cart.length > 0 && (
            <div className="bg-choco text-cream rounded-2xl p-5">
              <div className="flex items-center justify-between mb-1">
                <h2 className="font-display text-xl">Keranjang</h2>
                <span className="text-xs text-cream/60 shrink-0">{cartTotalQty}/{targetQty} pcs</span>
              </div>
              {cart.map((c) => (
                <div key={c.id} className="flex justify-between items-center py-3 border-b border-cream/10 text-sm">
                  <div>
                    <p className="font-medium">{c.variantName} <span className="text-cream/50">×{c.qty}</span></p>
                    <p className="text-cream/50 text-xs mt-0.5">{c.details.join(", ")}</p>
                  </div>
                  <button onClick={() => removeFromCart(c.id)} className="text-cream/40 hover:text-rust text-xs shrink-0">Hapus</button>
                </div>
              ))}
              <div className="flex justify-between items-center pt-4">
                <span className="font-display text-lg">Total</span>
                <span className="font-display text-lg text-gold">{formatRupiah(total)}</span>
              </div>
            </div>
          )}

          {cart.length > 0 && (
            <div className="bg-paper border border-kraft rounded-2xl p-5 space-y-3">
              <h2 className="font-display text-xl">Data Pemesan</h2>
              <input placeholder="Nama pemesan" value={customerName} onChange={(e) => setCustomerName(e.target.value)} className="w-full border border-kraft rounded-xl p-2.5 bg-white outline-none focus-visible:ring-2 focus-visible:ring-gold" />
              <input placeholder="No. HP (opsional)" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} className="w-full border border-kraft rounded-xl p-2.5 bg-white outline-none focus-visible:ring-2 focus-visible:ring-gold" />
              <textarea placeholder="Catatan (opsional)" value={note} onChange={(e) => setNote(e.target.value)} rows="2" className="w-full border border-kraft rounded-xl p-2.5 bg-white outline-none focus-visible:ring-2 focus-visible:ring-gold" />
              <button
                onClick={submitOrder}
                disabled={submitting || !isComplete}
                className="w-full bg-gradient-to-r from-gold to-rust hover:brightness-105 text-white rounded-full py-3.5 font-semibold transition disabled:opacity-40 disabled:grayscale focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold focus-visible:ring-offset-2"
              >
                {!isComplete ? `Lengkapi ${remaining} pcs lagi` : submitting ? "Memproses..." : "Pesan via WhatsApp"}
              </button>
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* =========================================================
   ADMIN — DAFTAR NAMA (dipakai untuk Varian Donat, Varian
   Bomboloni, Glaze, Topping, dan Filling — cuma nama, tanpa
   harga. showAvailability menambahkan toggle tersedia/habis,
   dipakai khusus untuk kedua daftar Varian.)
   ========================================================= */
function NameListManager({ collectionName, title, notify, showAvailability }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [newName, setNewName] = useState("");

  useEffect(() => {
    const unsub = db.collection(collectionName).orderBy("name").onSnapshot((snap) => {
      setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      setLoading(false);
    });
    return unsub;
  }, [collectionName]);

  async function addItem() {
    if (!newName.trim()) return notify(`Isi nama ${title.toLowerCase()} dulu`, "error");
    const data = { name: newName.trim() };
    if (showAvailability) data.available = true;
    await db.collection(collectionName).add(data);
    setNewName("");
    notify(`${title} ditambahkan`, "success");
  }

  async function updateItem(id, name) {
    await db.collection(collectionName).doc(id).update({ name });
  }

  async function toggleAvailable(id, available) {
    await db.collection(collectionName).doc(id).update({ available: !available });
  }

  async function deleteItem(id) {
    if (!window.confirm(`Hapus ${title.toLowerCase()} ini?`)) return;
    await db.collection(collectionName).doc(id).delete();
    notify(`${title} dihapus`, "success");
  }

  if (loading) return <Spinner />;

  return (
    <div className="bg-paper border border-kraft rounded-2xl p-4 space-y-3">
      <h3 className="font-semibold">{title}</h3>
      <div className="flex gap-2">
        <input
          placeholder={`Nama ${title.toLowerCase()}`} value={newName}
          onChange={(e) => setNewName(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addItem()}
          className="flex-1 border border-kraft rounded-xl p-2 bg-white text-sm outline-none focus-visible:ring-2 focus-visible:ring-gold"
        />
        <button onClick={addItem} className="bg-gold hover:bg-golddark text-white rounded-xl px-3.5 text-sm font-medium transition">Tambah</button>
      </div>
      {items.length === 0 && <EmptyState text={`Belum ada ${title.toLowerCase()}`} />}
      <div className="divide-y divide-kraft">
        {items.map((it) => (
          <div key={it.id} className="flex items-center gap-2 py-2.5">
            {showAvailability && (
              <input
                type="checkbox" checked={it.available !== false}
                onChange={() => toggleAvailable(it.id, it.available !== false)}
                title="Tersedia" className="w-4 h-4 accent-gold shrink-0"
              />
            )}
            <input defaultValue={it.name} onBlur={(e) => updateItem(it.id, e.target.value)} className="flex-1 border border-kraft rounded-lg p-1.5 text-sm bg-white outline-none focus-visible:ring-2 focus-visible:ring-gold" />
            <button onClick={() => deleteItem(it.id)} className="text-rust text-xs px-2 shrink-0">Hapus</button>
          </div>
        ))}
      </div>
      {showAvailability && <p className="text-xs text-chocosoft/50">Centang = tersedia. Hilangkan centang untuk sementara sembunyikan dari pilihan pelanggan.</p>}
    </div>
  );
}

function RestockManager({ notify }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [newName, setNewName] = useState("");
  const [newQty, setNewQty] = useState("");

  useEffect(() => {
    const unsub = db.collection("restock").orderBy("createdAt", "desc").onSnapshot((snap) => {
      setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      setLoading(false);
    });
    return unsub;
  }, []);

  async function addItem() {
    if (!newName.trim()) return notify("Isi nama barang dulu", "error");
    await db.collection("restock").add({
      name: newName.trim(),
      qty: newQty.trim(),
      done: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    setNewName(""); setNewQty("");
  }

  async function toggleDone(id, done) {
    await db.collection("restock").doc(id).update({ done: !done });
  }

  async function deleteItem(id) {
    await db.collection("restock").doc(id).delete();
  }

  if (loading) return <Spinner />;

  const belum = items.filter((i) => !i.done);
  const selesai = items.filter((i) => i.done);

  return (
    <div className="space-y-4">
      <div className="bg-paper border border-kraft rounded-2xl p-4 space-y-3">
        <h3 className="font-semibold">Daftar Belanja / Restock</h3>

          <input
            placeholder="Nama barang (mis. Tepung terigu)" value={newName}
            onChange={(e) => setNewName(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addItem()}
            className="flex-1 border border-kraft rounded-xl p-2 bg-white text-sm outline-none focus-visible:ring-2 focus-visible:ring-gold"
          />
          <input placeholder="Jumlah" value={newQty} onChange={(e) => setNewQty(e.target.value)} className="w-24 border border-kraft rounded-xl p-2 bg-white text-sm outline-none focus-visible:ring-2 focus-visible:ring-gold" />
          <button onClick={addItem} className="bg-gold hover:bg-golddark text-white rounded-xl px-3.5 text-sm font-medium transition">Tambah</button>
        </div>
      </div>

      <div className="bg-paper border border-kraft rounded-2xl p-4">
        <h3 className="font-semibold mb-1">Perlu dibeli ({belum.length})</h3>
        {belum.length === 0 && <EmptyState text="Tidak ada yang perlu dibeli" />}
        <div className="divide-y divide-kraft">
          {belum.map((it) => (
            <label key={it.id} className="flex items-center gap-3 py-2.5 cursor-pointer">
              <input type="checkbox" checked={it.done} onChange={() => toggleDone(it.id, it.done)} className="w-4 h-4 accent-gold" />
              <span className="flex-1 text-sm">{it.name}{it.qty && ` — ${it.qty}`}</span>
              <button onClick={(e) => { e.preventDefault(); deleteItem(it.id); }} className="text-rust text-xs px-2">Hapus</button>
            </label>
          ))}
        </div>
      </div>

      {selesai.length > 0 && (
        <div className="bg-paper border border-kraft rounded-2xl p-4">
          <h3 className="font-semibold mb-1 text-chocosoft/60">Sudah dibeli ({selesai.length})</h3>
          <div className="divide-y divide-kraft">
            {selesai.map((it) => (
              <label key={it.id} className="flex items-center gap-3 py-2.5 cursor-pointer opacity-50">
                <input type="checkbox" checked={it.done} onChange={() => toggleDone(it.id, it.done)} className="w-4 h-4 accent-gold" />
                <span className="flex-1 text-sm line-through">{it.name}{it.qty && ` — ${it.qty}`}</span>
                <button onClick={(e) => { e.preventDefault(); deleteItem(it.id); }} className="text-rust text-xs px-2">Hapus</button>
              </label>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

const ORDER_STATUSES = [
  { key: "baru", label: "Baru" },
  { key: "diproses", label: "Diproses" },
  { key: "selesai", label: "Selesai" },
];

function statusBadgeClass(status) {
  if (status === "selesai") return "bg-green-100 text-green-700";
  if (status === "diproses") return "bg-gold/20 text-golddark";
  return "bg-rust/10 text-rust";
}

function OrderCard({ order, notify }) {
  async function setStatus(next) {
    try {
      await db.collection("orders").doc(order.id).update({ status: next });
    } catch (err) {
      notify("Gagal mengubah status: " + err.message, "error");
    }
  }

  async function hapus() {
    if (!window.confirm("Hapus pesanan ini dari daftar?")) return;
    await db.collection("orders").doc(order.id).delete();
    notify("Pesanan dihapus", "success");
  }

  const waLink = toWaLink(
    order.customerPhone,
    `Halo ${order.customerName}, terkait pesanan ${order.category === "donat" ? "Donat" : "Bomboloni"} Anda di ${NAMA_TOKO}...`
  );
  const statusInfo = ORDER_STATUSES.find((s) => s.key === order.status);

  return (
    <div className="bg-paper border border-kraft rounded-2xl p-4 space-y-2.5">
      <div className="flex items-start justify-between gap-2">
        <div>
          <p className="font-semibold text-choco">{order.customerName}</p>
          <p className="text-xs text-chocosoft/60">{formatWaktu(order.createdAt)} · {order.category === "donat" ? "Donat" : "Bomboloni"} · {order.boxQty} pcs</p>
        </div>
        <span className={`text-xs px-2.5 py-1 rounded-full font-medium shrink-0 ${statusBadgeClass(order.status)}`}>
          {statusInfo ? statusInfo.label : "Baru"}
        </span>
      </div>

      <div className="text-sm text-chocosoft space-y-0.5">
        {(order.items || []).map((it, i) => (
          <p key={it.id || i}>{it.variantName} — {(it.details || []).join(", ")} <span className="text-chocosoft/50">×{it.qty}</span></p>
        ))}
      </div>

      {order.note && <p className="text-xs text-chocosoft bg-kraft/30 rounded-lg px-2.5 py-1.5">Catatan: {order.note}</p>}

      <div className="flex items-center justify-between pt-1">
        <span className="font-display text-base text-rust">{formatRupiah(order.total)}</span>
        {waLink && (
          <a href={waLink} target="_blank" rel="noreferrer" className="text-xs text-green-700 underline underline-offset-2">Chat WA pelanggan</a>
        )}
      </div>

      <div className="flex items-center gap-1.5 pt-1.5 border-t border-kraft/60">
        {ORDER_STATUSES.map((s) => (
          <button
            key={s.key}
            onClick={() => setStatus(s.key)}
            className={`flex-1 text-xs py-1.5 rounded-full font-medium transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold ${order.status === s.key ? "bg-choco text-cream" : "bg-kraft/30 text-chocosoft hover:bg-kraft/50"}`}
          >
            {s.label}
          </button>
        ))}
        <button onClick={hapus} className="text-xs text-rust px-2 shrink-0">Hapus</button>
      </div>
    </div>
  );
}

function OrdersManager({ notify }) {
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState("aktif"); // aktif | semua | baru | diproses | selesai

  useEffect(() => {
    const unsub = db.collection("orders").orderBy("createdAt", "desc").limit(100).onSnapshot(
      (snap) => { setOrders(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); },
      (err) => { console.error("orders:", err); setLoading(false); }
    );
    return unsub;
  }, []);

  if (loading) return <Spinner />;

  const counts = {
    baru: orders.filter((o) => !o.status || o.status === "baru").length,
    diproses: orders.filter((o) => o.status === "diproses").length,
    selesai: orders.filter((o) => o.status === "selesai").length,
  };

  const filtered = orders.filter((o) => {
    if (filter === "semua") return true;
    if (filter === "aktif") return o.status !== "selesai";
    if (filter === "baru") return !o.status || o.status === "baru";
    return o.status === filter;
  });

  const filterTabs = [
    { key: "aktif", label: "Aktif" },
    { key: "semua", label: `Semua (${orders.length})` },
    { key: "baru", label: `Baru (${counts.baru})` },
    { key: "diproses", label: `Diproses (${counts.diproses})` },
    { key: "selesai", label: `Selesai (${counts.selesai})` },
  ];

  return (
    <div className="space-y-4">
      <div className="flex gap-1.5 overflow-x-auto pb-1">
        {filterTabs.map((f) => (
          <button
            key={f.key}
            onClick={() => setFilter(f.key)}
            className={`px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold ${filter === f.key ? "bg-choco text-cream" : "bg-kraft/40 text-chocosoft"}`}
          >
            {f.label}
          </button>
        ))}
      </div>

      {orders.length === 100 && (
        <p className="text-xs text-chocosoft/50 text-center">Menampilkan 100 pesanan terbaru. Riwayat lebih lama bisa dicek di Firebase Console.</p>
      )}

      {filtered.length === 0 ? (
        <EmptyState text="Belum ada pesanan di kategori ini." />
      ) : (
        <div className="space-y-3">
          {filtered.map((o) => <OrderCard key={o.id} order={o} notify={notify} />)}
        </div>
      )}
    </div>
  );
}

  const [user, setUser] = useState(undefined);
  const [toast, setToast] = useState({ message: "", type: "success" });

  useEffect(() => auth.onAuthStateChanged(setUser), []);

  function notify(message, type = "success") {
    setToast({ message, type });
    setTimeout(() => setToast({ message: "", type: "success" }), 3000);
  }

  return (
    <div className="min-h-screen bg-cream pb-16">
      <Toast toast={toast} onClose={() => setToast({ message: "", type: "success" })} />
      <Header view={view} setView={setView} />
      {view === "order" ? (
        <OrderPage notify={notify} />
      ) : user === undefined ? (
        <Spinner />
      ) : user ? (
        <AdminPage notify={notify} />
      ) : (
        <AdminLogin notify={notify} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
