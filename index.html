/* =========================================================
   UTILITAS
   ========================================================= */
function formatRupiah(angka) {
  return new Intl.NumberFormat("id-ID", {
    style: "currency",
    currency: "IDR",
    minimumFractionDigits: 0,
  }).format(angka || 0);
}

function generateId() {
  return Math.random().toString(36).slice(2, 10);
}

   IKON
   ========================================================= */

      <circle cx="13" cy="21" r="1.3" fill="#FFFDF8" />
    </svg>
  );
}

/* =========================================================
   KOMPONEN UMUM
   ========================================================= */
function Spinner() {
  return (
    <div className="flex justify-center py-10">
      <div className="w-8 h-8 border-4 border-kraft border-t-raspberry rounded-full animate-spin"></div>
    </div>
  );
}

function EmptyState({ text }) {
  return <p className="text-center text-chocosoft/60 text-sm py-6">{text}</p>;
}

function Toast({ toast, onClose }) {
  if (!toast.message) return null;
  const isError = toast.type === "error";
  return (
    <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full shadow-lg text-sm font-medium flex items-center gap-3 ${isError ? "bg-choco text-cream" : "bg-raspberry text-white"}`}>
      <span>{toast.message}</span>
      <button onClick={onClose} className="opacity-60 hover:opacity-100">✕</button>
    </div>
  );
}

/* =========================================================
   HALAMAN PEMESANAN
   ========================================================= */
function OrderPage({ notify }) {
  const [variants, setVariants] = useState([]);
  const [glazes, setGlazes] = useState([]);
  const [toppings, setToppings] = useState([]);
  const [loading, setLoading] = useState(true);

  const [selVariant, setSelVariant] = useState("");
  const [selGlaze, setSelGlaze] = useState("");
  const [selTopping, setSelTopping] = useState("");
  const [qty, setQty] = useState(1);

  const [cart, setCart] = useState([]);
  const [customerName, setCustomerName] = useState("");
  const [customerPhone, setCustomerPhone] = useState("");
  const [note, setNote] = useState("");
  const [submitting, setSubmitting] = useState(false);

  useEffect(() => {
    const unsub1 = db.collection("variants").orderBy("name").onSnapshot(
      (snap) => setVariants(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      (err) => console.error("variants:", err)
    );
    const unsub2 = db.collection("glazes").orderBy("name").onSnapshot(
      (snap) => setGlazes(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      (err) => console.error("glazes:", err)
    );
    const unsub3 = db.collection("toppings").orderBy("name").onSnapshot(
      (snap) => {
        setToppings(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        setLoading(false);
      },
      (err) => { console.error("toppings:", err); setLoading(false); }
    );
    return () => { unsub1(); unsub2(); unsub3(); };
  }, []);

  function addToCart() {
    if (!selVariant) return notify("Pilih varian donat dulu", "error");
    const variant = variants.find((v) => v.id === selVariant);
    const glaze = glazes.find((g) => g.id === selGlaze);
    const topping = toppings.find((t) => t.id === selTopping);
    const hargaSatuan = (variant?.price || 0) + (glaze?.extraPrice || 0) + (topping?.extraPrice || 0);
    setCart((prev) => [
      ...prev,
      {
        id: generateId(),
        variantName: variant?.name || "",
        glazeName: glaze?.name || "Tanpa glaze",
        toppingName: topping?.name || "Tanpa topping",
        qty,
        hargaSatuan,
        subtotal: hargaSatuan * qty,
      },
    ]);
    setSelVariant(""); setSelGlaze(""); setSelTopping(""); setQty(1);
  }

  function removeFromCart(id) {
    setCart((prev) => prev.filter((c) => c.id !== id));
  }

  const total = useMemo(() => cart.reduce((sum, c) => sum + c.subtotal, 0), [cart]);

  async function submitOrder() {
    if (cart.length === 0) return notify("Keranjang masih kosong", "error");
    if (!customerName.trim()) return notify("Nama pemesan harus diisi", "error");
    setSubmitting(true);
    try {
      await db.collection("orders").add({
        customerName: customerName.trim(),
        customerPhone: customerPhone.trim(),
        note: note.trim(),
        items: cart,
        total,
        status: "baru",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });

      let msg = `Halo ${NAMA_TOKO}, saya ingin pesan:\n\n`;
      cart.forEach((c, i) => {
        msg += `${i + 1}. Donat ${c.variantName} - ${c.glazeName}, ${c.toppingName} (x${c.qty}) = ${formatRupiah(c.subtotal)}\n`;
      });
      msg += `\nTotal: ${formatRupiah(total)}\n\nAtas nama: ${customerName.trim()}`;
      if (customerPhone.trim()) msg += `\nNo. HP: ${customerPhone.trim()}`;
      if (note.trim()) msg += `\nCatatan: ${note.trim()}`;

      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");

      setCart([]); setCustomerName(""); setCustomerPhone(""); setNote("");
      notify("Pesanan tersimpan, lanjutkan di WhatsApp yang baru terbuka", "success");
    } catch (err) {
      console.error(err);
      notify("Gagal menyimpan pesanan: " + err.message, "error");
    } finally {
      setSubmitting(false);
    }
  }

  if (loading) return <Spinner />;

  return (
    <div className="max-w-md mx-auto px-5 py-6 space-y-5">
      <div className="bg-paper border border-kraft rounded-2xl p-5 space-y-3.5">
        <h2 className="font-display text-xl">Tambah Pesanan</h2>

        <div>
          <label className="text-sm text-chocosoft">Varian donat</label>
          <select value={selVariant} onChange={(e) => setSelVariant(e.target.value)} className="w-full border border-kraft rounded-xl p-2.5 mt-1 bg-white">
            <option value="">Pilih varian</option>
            {variants.map((v) => (
              <option key={v.id} value={v.id}>{v.name} — {formatRupiah(v.price)}</option>
            ))}
          </select>
          {variants.length === 0 && <p className="text-xs text-raspberry mt-1">Belum ada varian donat. Tambahkan lewat menu Admin.</p>}
        </div>

        <div>
          <label className="text-sm text-chocosoft">Glaze</label>
          <select value={selGlaze} onChange={(e) => setSelGlaze(e.target.value)} className="w-full border border-kraft rounded-xl p-2.5 mt-1 bg-white">
            <option value="">Tanpa glaze</option>
            {glazes.map((g) => (
              <option key={g.id} value={g.id}>{g.name}{g.extraPrice ? ` (+${formatRupiah(g.extraPrice)})` : ""}</option>
            ))}
          </select>
        </div>

        <div>
          <label className="text-sm text-chocosoft">Topping</label>
          <select value={selTopping} onChange={(e) => setSelTopping(e.target.value)} className="w-full border border-kraft rounded-xl p-2.5 mt-1 bg-white">
            <option value="">Tanpa topping</option>
            {toppings.map((t) => (
              <option key={t.id} value={t.id}>{t.name}{t.extraPrice ? ` (+${formatRupiah(t.extraPrice)})` : ""}</option>
            ))}
          </select>
        </div>

        <div>
          <label className="text-sm text-chocosoft">Jumlah</label>
          <input
            type="number" min="1" value={qty}
            onChange={(e) => setQty(Math.max(1, parseInt(e.target.value) || 1))}
            className="w-full border border-kraft rounded-xl p-2.5 mt-1 bg-white"
          />
        </div>

        <button onClick={addToCart} className="w-full bg-raspberry hover:bg-raspberrydark text-white rounded-full py-3 font-semibold transition">
          Tambah ke Keranjang
        </button>
      </div>

      {cart.length > 0 && (
        <div className="bg-choco text-cream rounded-2xl p-5">
          <h2 className="font-display text-xl mb-1">Keranjang</h2>
          {cart.map((c) => (
            <div key={c.id} className="flex justify-between items-start py-3 border-b border-cream/10 text-sm">
              <div>
                <p className="font-medium">{c.variantName} <span className="text-cream/50">×{c.qty}</span></p>
                <p className="text-cream/50 text-xs mt-0.5">{c.glazeName}, {c.toppingName}</p>
              </div>
              <div className="flex items-center gap-3 shrink-0">
                <span>{formatRupiah(c.subtotal)}</span>
                <button onClick={() => removeFromCart(c.id)} className="text-cream/40 hover:text-raspberry text-xs">Hapus</button>
              </div>
            </div>
          ))}
          <div className="flex justify-between items-center pt-4">
            <span className="font-display text-lg">Total</span>
            <span className="font-display text-lg text-butter">{formatRupiah(total)}</span>
          </div>
        </div>
      )}

      {cart.length > 0 && (
        <div className="bg-paper border border-kraft rounded-2xl p-5 space-y-3">
          <h2 className="font-display text-xl">Data Pemesan</h2>
          <input placeholder="Nama pemesan" value={customerName} onChange={(e) => setCustomerName(e.target.value)} className="w-full border border-kraft rounded-xl p-2.5 bg-white" />
          <input placeholder="No. HP (opsional)" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} className="w-full border border-kraft rounded-xl p-2.5 bg-white" />
          <textarea placeholder="Catatan (opsional)" value={note} onChange={(e) => setNote(e.target.value)} rows="2" className="w-full border border-kraft rounded-xl p-2.5 bg-white" />
          <button onClick={submitOrder} disabled={submitting} className="w-full bg-raspberry hover:bg-raspberrydark text-white rounded-full py-3.5 font-semibold transition disabled:opacity-50">
            {submitting ? "Memproses..." : "Pesan via WhatsApp"}
          </button>
        </div>
      )}
    </div>
  );
}

/* =========================================================
   ADMIN — LOGIN
   ========================================================= */
function AdminLogin({ notify }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);

  async function handleLogin(e) {
    e.preventDefault();
    setLoading(true);
    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch (err) {
      notify("Login gagal, periksa email dan password", "error");
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="max-w-sm mx-auto px-5 py-10">
      <div className="bg-paper border border-kraft rounded-2xl p-6">
        <h2 className="font-display text-xl mb-4">Masuk Sebagai Admin</h2>
        <form onSubmit={handleLogin} className="space-y-3">
          <input type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} required className="w-full border border-kraft rounded-xl p-2.5 bg-white" />
          <input type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} required className="w-full border border-kraft rounded-xl p-2.5 bg-white" />
          <button type="submit" disabled={loading} className="w-full bg-raspberry hover:bg-raspberrydark text-white rounded-full py-3 font-semibold transition disabled:opacity-50">
            {loading ? "Memuat..." : "Masuk"}
          </button>
        </form>
        <p className="text-xs text-chocosoft/60 mt-4">Buat akun admin lewat Firebase Console → Authentication.</p>
      </div>
    </div>
  );
}

/* =========================================================
   ADMIN — PENGELOLA DAFTAR (dipakai untuk Glaze & Topping)
   ========================================================= */
function ListManager({ collectionName, title, notify }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [newName, setNewName] = useState("");
  const [newExtra, setNewExtra] = useState("");

  useEffect(() => {
    const unsub = db.collection(collectionName).orderBy("name").onSnapshot((snap) => {
      setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      setLoading(false);
    });
    return unsub;
  }, [collectionName]);

  async function addItem() {
    if (!newName.trim()) return notify(`Isi nama ${title.toLowerCase()} dulu`, "error");
    await db.collection(collectionName).add({ name: newName.trim(), extraPrice: Number(newExtra) || 0 });
    setNewName(""); setNewExtra("");
    notify(`${title} ditambahkan`, "success");
  }

  async function updateItem(id, field, value) {
    await db.collection(collectionName).doc(id).update({ [field]: field === "extraPrice" ? (Number(value) || 0) : value });
  }

  async function deleteItem(id) {
    if (!window.confirm(`Hapus ${title.toLowerCase()} ini?`)) return;
    await db.collection(collectionName).doc(id).delete();
    notify(`${title} dihapus`, "success");
  }

  if (loading) return <Spinner />;

  return (
    <div className="bg-paper border border-kraft rounded-2xl p-4 space-y-3">
      <h3 className="font-semibold">{title}</h3>
      <div className="flex gap-2">
        <input
          placeholder={`Nama ${title.toLowerCase()}`} value={newName}
          onChange={(e) => setNewName(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addItem()}
          className="flex-1 border border-kraft rounded-xl p-2 bg-white text-sm"
        />
        <input placeholder="Tambahan harga" type="number" min="0" value={newExtra} onChange={(e) => setNewExtra(e.target.value)} className="w-28 border border-kraft rounded-xl p-2 bg-white text-sm" />
        <button onClick={addItem} className="bg-raspberry hover:bg-raspberrydark text-white rounded-xl px-3.5 text-sm font-medium">Tambah</button>
      </div>
      {items.length === 0 && <EmptyState text={`Belum ada ${title.toLowerCase()}`} />}
      <div className="divide-y divide-kraft">
        {items.map((it) => (
          <div key={it.id} className="flex items-center gap-2 py-2.5">
            <input defaultValue={it.name} onBlur={(e) => updateItem(it.id, "name", e.target.value)} className="flex-1 border border-kraft rounded-lg p-1.5 text-sm bg-white" />
            <input defaultValue={it.extraPrice} type="number" min="0" onBlur={(e) => updateItem(it.id, "extraPrice", e.target.value)} className="w-24 border border-kraft rounded-lg p-1.5 text-sm bg-white" />
            <button onClick={() => deleteItem(it.id)} className="text-raspberry text-xs px-2 shrink-0">Hapus</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* =========================================================
   ADMIN — HARGA VARIAN
   ========================================================= */
function PricingManager({ notify }) {
  const [variants, setVariants] = useState([]);
  const [loading, setLoading] = useState(true);
  const [newName, setNewName] = useState("");
  const [newPrice, setNewPrice] = useState("");

  useEffect(() => {
    const unsub = db.collection("variants").orderBy("name").onSnapshot((snap) => {
      setVariants(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      setLoading(false);
    });
    return unsub;
  }, []);

  async function addVariant() {
    if (!newName.trim() || newPrice === "") return notify("Isi nama dan harga varian", "error");
    await db.collection("variants").add({ name: newName.trim(), price: Number(newPrice) || 0 });
    setNewName(""); setNewPrice("");
    notify("Varian ditambahkan", "success");
  }

  async function updateField(id, field, value) {
    await db.collection("variants").doc(id).update({ [field]: field === "price" ? (Number(value) || 0) : value });
  }

  async function deleteVariant(id) {
    if (!window.confirm("Hapus varian ini?")) return;
    await db.collection("variants").doc(id).delete();
    notify("Varian dihapus", "success");
  }

  if (loading) return <Spinner />;

  return (
    <div className="bg-paper border border-kraft rounded-2xl p-4 space-y-3">
      <h3 className="font-semibold">Varian & Harga Donat</h3>
      <div className="flex gap-2">
        <input
          placeholder="Nama varian (mis. Ori)" value={newName}
          onChange={(e) => setNewName(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addVariant()}
          className="flex-1 border border-kraft rounded-xl p-2 bg-white text-sm"
        />
        <input placeholder="Harga" type="number" min="0" value={newPrice} onChange={(e) => setNewPrice(e.target.value)} className="w-28 border border-kraft rounded-xl p-2 bg-white text-sm" />
        <button onClick={addVariant} className="bg-raspberry hover:bg-raspberrydark text-white rounded-xl px-3.5 text-sm font-medium">Tambah</button>
      </div>
      {variants.length === 0 && <EmptyState text="Belum ada varian donat" />}
      <div className="divide-y divide-kraft">
        {variants.map((v) => (
          <div key={v.id} className="flex items-center gap-2 py-2.5">
            <input defaultValue={v.name} onBlur={(e) => updateField(v.id, "name", e.target.value)} className="flex-1 border border-kraft rounded-lg p-1.5 text-sm bg-white" />
            <input defaultValue={v.price} type="number" min="0" onBlur={(e) => updateField(v.id, "price", e.target.value)} className="w-28 border border-kraft rounded-lg p-1.5 text-sm bg-white" />
            <button onClick={() => deleteVariant(v.id)} className="text-raspberry text-xs px-2 shrink-0">Hapus</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* =========================================================
   ADMIN — BELANJA / RESTOCK
   ========================================================= */
function RestockManager({ notify }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [newName, setNewName] = useState("");
  const [newQty, setNewQty] = useState("");

  useEffect(() => {
    const unsub = db.collection("restock").orderBy("createdAt", "desc").onSnapshot((snap) => {
      setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      setLoading(false);
    });
    return unsub;
  }, []);

  async function addItem() {
    if (!newName.trim()) return notify("Isi nama barang dulu", "error");
    await db.collection("restock").add({
      name: newName.trim(),
      qty: newQty.trim(),
      done: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    setNewName(""); setNewQty("");
  }

  async function toggleDone(id, done) {
    await db.collection("restock").doc(id).update({ done: !done });
  }

  async function deleteItem(id) {
    await db.collection("restock").doc(id).delete();
  }

  if (loading) return <Spinner />;

  const belum = items.filter((i) => !i.done);
  const selesai = items.filter((i) => i.done);

  return (
    <div className="space-y-4">
      <div className="bg-paper border border-kraft rounded-2xl p-4 space-y-3">
        <h3 className="font-semibold">Daftar Belanja / Restock</h3>
        <div className="flex gap-2">
          <input
            placeholder="Nama barang (mis. Tepung terigu)" value={newName}
            onChange={(e) => setNewName(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addItem()}
            className="flex-1 border border-kraft rounded-xl p-2 bg-white text-sm"
          />
          <input placeholder="Jumlah" value={newQty} onChange={(e) => setNewQty(e.target.value)} className="w-24 border border-kraft rounded-xl p-2 bg-white text-sm" />
          <button onClick={addItem} className="bg-raspberry hover:bg-raspberrydark text-white rounded-xl px-3.5 text-sm font-medium">Tambah</button>
        </div>
      </div>

      <div className="bg-paper border border-kraft rounded-2xl p-4">
        <h3 className="font-semibold mb-1">Perlu dibeli ({belum.length})</h3>
        {belum.length === 0 && <EmptyState text="Tidak ada yang perlu dibeli" />}
        <div className="divide-y divide-kraft">
          {belum.map((it) => (
            <label key={it.id} className="flex items-center gap-3 py-2.5 cursor-pointer">
              <input type="checkbox" checked={it.done} onChange={() => toggleDone(it.id, it.done)} className="w-4 h-4 accent-raspberry" />
              <span className="flex-1 text-sm">{it.name}{it.qty && ` — ${it.qty}`}</span>
              <button onClick={(e) => { e.preventDefault(); deleteItem(it.id); }} className="text-raspberry text-xs px-2">Hapus</button>
            </label>
          ))}
        </div>
      </div>

      {selesai.length > 0 && (
        <div className="bg-paper border border-kraft rounded-2xl p-4">
          <h3 className="font-semibold mb-1 text-chocosoft/60">Sudah dibeli ({selesai.length})</h3>
          <div className="divide-y divide-kraft">
            {selesai.map((it) => (
              <label key={it.id} className="flex items-center gap-3 py-2.5 cursor-pointer opacity-50">
                <input type="checkbox" checked={it.done} onChange={() => toggleDone(it.id, it.done)} className="w-4 h-4 accent-raspberry" />
                <span className="flex-1 text-sm line-through">{it.name}{it.qty && ` — ${it.qty}`}</span>
                <button onClick={(e) => { e.preventDefault(); deleteItem(it.id); }} className="text-raspberry text-xs px-2">Hapus</button>
              </label>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* =========================================================
   ADMIN — HALAMAN UTAMA
   ========================================================= */
function AdminPage({ notify }) {
  const [tab, setTab] = useState("harga");
  const tabs = [
    { key: "harga", label: "Harga" },
    { key: "glaze", label: "Glaze & Topping" },
    { key: "restock", label: "Belanja" },
  ];

  return (
    <div className="max-w-md mx-auto px-5 py-6 space-y-4">
      <div className="flex justify-between items-center">
        <h2 className="font-display text-xl">Panel Admin</h2>
        <button onClick={() => auth.signOut()} className="text-xs text-chocosoft underline">Keluar</button>
      </div>

      <div className="flex gap-1 bg-kraft/40 rounded-full p-1">
        {tabs.map((t) => (
          <button
            key={t.key}
            onClick={() => setTab(t.key)}
            className={`flex-1 py-2 rounded-full text-sm font-medium transition ${tab === t.key ? "bg-choco text-cream" : "text-chocosoft"}`}
          >
            {t.label}
          </button>
        ))}
      </div>

      {tab === "harga" && <PricingManager notify={notify} />}
      {tab === "glaze" && (
        <div className="space-y-4">
          <ListManager collectionName="glazes" title="Glaze" notify={notify} />
          <ListManager collectionName="toppings" title="Topping" notify={notify} />
        </div>
      )}
      {tab === "restock" && <RestockManager notify={notify} />}
    </div>
  );
}

/* =========================================================
   APP
   ========================================================= */
function App() {
  const [view, setView] = useState("order");
  const [user, setUser] = useState(undefined);
  const [toast, setToast] = useState({ message: "", type: "success" });

  useEffect(() => auth.onAuthStateChanged(setUser), []);

  function notify(message, type = "success") {
    setToast({ message, type });
    setTimeout(() => setToast({ message: "", type: "success" }), 3000);
  }

  return (
    <div className="min-h-screen bg-cream pb-16">
      <Toast toast={toast} onClose={() => setToast({ message: "", type: "success" })} />
      <Header view={view} setView={setView} />
      {view === "order" ? (
        <OrderPage notify={notify} />
      ) : user === undefined ? (
        <Spinner />
      ) : user ? (
        <AdminPage notify={notify} />
      ) : (
        <AdminLogin notify={notify} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
